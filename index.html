<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gulshan Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Portfolio Header -->
  <header>
    <h1>Welcome to My Portfolio</h1>
    <p>Hi, I’m Gulshan — a CSE student at LPU. Explore my projects, skills, and contact options below.</p>
  </header>

  <!-- Example Content -->
  <section>
    <h2>Projects</h2>
    <p>Here you can showcase your GitHub projects, certificates, and skills.</p>
  </section>

  <section>
    <h2>About Me</h2>
    <p>I love anime, tech comparisons, and building futuristic web designs.</p>
  </section>

  <!-- Contact Menu -->
  <div class="contact-menu">
    <button id="contactToggle">📞</button>
    <div class="contact-options">
      <a href="https://wa.me/91XXXXXXXXXX" target="_blank" title="WhatsApp">💬</a>
      <a href="mailto:yourname@example.com" title="Email">📧</a>
      <a href="https://t.me/yourusername" target="_blank" title="Telegram">📱</a>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTop">⬆</button>

  <!-- Ping Sound -->
  <audio id="pingSound" src="ping.mp3" preload="auto"></audio>

  <!-- Scripts -->
  <script>
    const contactToggle = document.getElementById("contactToggle");
    const contactOptions = document.querySelector(".contact-options");
    const pingSound = document.getElementById("pingSound");
    const backToTop = document.getElementById("backToTop");

    // Toggle Contact Menu
    contactToggle.addEventListener("click", () => {
      contactOptions.classList.toggle("show");

      // Play sound when expanding
      if (contactOptions.classList.contains("show")) {
        pingSound.currentTime = 0;
        pingSound.play();
      }
    });

    // Show Back to Top button on scroll
    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        backToTop.classList.add("show");
      } else {
        backToTop.classList.remove("show");
      }
    });

    // Back to Top click with glowing trail
    backToTop.addEventListener("click", () => {
      backToTop.classList.add("clicked");
      setTimeout(() => backToTop.classList.remove("clicked"), 600);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
